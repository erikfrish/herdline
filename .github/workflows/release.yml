name: Release

# Modified for Herdline (2026): GitHub Releases and a fork-owned manifest;
# no upstream website, Cloudflare deployment, or private-network credentials.
on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install --yes socat
      - name: Read the release identity
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          case "$version" in ''|*[!0-9A-Za-z.-]*) echo 'Invalid version' >&2; exit 1;; esac
          tag=v$version
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo 'Tag does not match the app version' >&2; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - name: Install Android build packages
        run: |
          # sdkmanager prompts for license acceptance on stdin; the feeder can
          # die of SIGPIPE, so drop pipefail and keep sdkmanager's exit code.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust and cargo-ndk
        run: |
          rustup toolchain install
          cargo install cargo-ndk --version 4.1.2 --locked
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.HERDLINE_KEYSTORE_BASE64 }}
          HERDLINE_KEYSTORE_PASSWORD: ${{ secrets.HERDLINE_KEYSTORE_PASSWORD }}
          HERDLINE_KEY_ALIAS: ${{ secrets.HERDLINE_KEY_ALIAS }}
          HERDLINE_KEY_PASSWORD: ${{ secrets.HERDLINE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$HERDLINE_KEYSTORE_PASSWORD"
          test -n "$HERDLINE_KEY_ALIAS"
          export HERDLINE_KEYSTORE="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$HERDLINE_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$HERDLINE_KEYSTORE"
          chmod 600 "$HERDLINE_KEYSTORE"
          ./gradlew --console=plain testDebugUnitTest assembleRelease
      - name: Prepare the verified candidate
        run: scripts/release-manifest.sh app/build/outputs/apk/release/app-release.apk dist "release-notes/$VERSION.en.txt"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "dist/herdline-$VERSION.apk" dist/latest.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Herdline $VERSION" --notes-file "release-notes/$VERSION.en.txt" --prerelease
      - name: Update the candidate feed after the asset exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest=$(realpath dist/latest.json)
          git fetch origin main
          git checkout -B feed origin/main
          mkdir -p updates
          if [ -f updates/latest.json ]; then
            jq --slurpfile previous updates/latest.json '.stable = $previous[0].stable' "$manifest" > updates/latest.json.tmp
          else
            cp "$manifest" updates/latest.json.tmp
          fi
          mv updates/latest.json.tmp updates/latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(updates): offer $VERSION as an untested candidate [skip ci]"
            git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:main
          fi

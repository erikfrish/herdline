name: CI
# Modified for Herdline (2026): independent SDK and artifact identity.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Rust core, unit tests, APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Must match app/build.gradle.kts.
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install --yes socat

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      # libghostty-vt-sys builds Ghostty with Zig; its pinned commit needs 0.15.2.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install Android build packages
        run: |
          # sdkmanager prompts for license acceptance on stdin; the feeder can
          # die of SIGPIPE, so drop pipefail and keep sdkmanager's exit code.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # rust-toolchain.toml pins the version, components, and Android targets.
      - name: Install Rust and cargo-ndk
        run: |
          rustup toolchain install
          cargo install cargo-ndk --version 4.1.2 --locked

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Rust workspace
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --locked --all-targets -- -D warnings
          cargo test --workspace --locked

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Unit tests and APKs
        run: ./gradlew --console=plain testDebugUnitTest assembleDebug assembleRelease

      - name: Critical rendered UI checks
        timeout-minutes: 15
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          sudo chmod a+rw /dev/kvm
          sdkmanager --install "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd --name qa-ci --package "system-images;android-35;google_apis;x86_64"
          emulator -avd qa-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 180 adb -s emulator-5554 wait-for-device
          timeout 180 python3 - <<'PY'
          import subprocess
          import time
          while subprocess.check_output(["adb", "-s", "emulator-5554", "shell", "getprop", "sys.boot_completed"], text=True).strip() != "1":
              time.sleep(1)
          PY
          adb -s emulator-5554 shell input keyevent 82
          adb -s emulator-5554 shell settings put secure show_ime_with_hard_keyboard 1
          export ANDROID_SERIAL=emulator-5554
          ./gradlew --console=plain :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=io.github.erikfrish.herdline.ui.session.TabsHeaderTest,io.github.erikfrish.herdline.e2e.PinSheetTest,io.github.erikfrish.herdline.ui.terminal.TerminalViewImeTest

      - name: Upload UI failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: critical-ui-failure
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdline-apks
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error
          retention-days: 14
